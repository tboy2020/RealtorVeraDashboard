<html lang="en">
<head>
<meta charset="UTF-8"/>

<title>RealtorVera · Command Center</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f5f0;--card:#fff;--card2:#f0efea;--bdr:#e0ddd5;--bdr2:#d0cdc5;--txt:#1a1a1a;--muted:#888;--dim:#bbb;--gold:#c47f00;--green:#2e7d32;--blue:#1565c0;--red:#c62828;--purple:#6a1b9a}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}

/* header */
#hdr{background:linear-gradient(135deg,#fffaf0,#fff8e8 50%,#fffaf0);border-bottom:1px solid #e8d8b0;padding:13px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:16px;font-weight:700;color:#b06a00}
.sub{font-size:11px;color:#a08060;margin-top:2px}
#alert-bell{position:relative;background:none;border:none;font-size:22px;cursor:pointer;padding:4px}
#alert-count{position:absolute;top:0;right:0;background:#c62828;color:#fff;font-size:9px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}

/* tabs */
#tabs{display:flex;background:#fff;border-bottom:1px solid var(--bdr);overflow-x:auto;padding:0 14px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{font-size:11px;font-weight:600;padding:11px 10px;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--gold);border-bottom:2px solid var(--gold)}

/* body */
#body{padding:14px 14px;max-width:860px;margin:0 auto}
.panel{display:none}.panel.on{display:block}

/* cards */
.box{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px;margin-bottom:10px}
.box.hi{border-color:#e8d8b0}.box.faded{opacity:.5}
.box.amber{border-color:#ffe082;background:#fffde7}
.box.green{border-color:#a5d6a7;background:#f0faf0}
.box.blue{border-color:#90caf9;background:#f0f7ff}
.box.red{border-color:#ef9a9a;background:#fff5f5}

/* typography */
.ptitle{font-size:18px;font-weight:700;color:var(--gold)}
.section{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bdr)}

/* buttons */
.gbtn{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;min-height:44px}
.sbtn{background:var(--card2);color:var(--gold);border:1px solid var(--bdr2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;min-height:38px}
.sbtn.grn{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
.sbtn.blu{background:#e3f2fd;border-color:#90caf9;color:#1565c0}
.sbtn.sml{padding:4px 10px;font-size:11px;min-height:30px}
.sbtn.red{background:#ffebee;border-color:#ef9a9a;color:#c62828}
.xbtn{background:none;border:none;color:var(--dim);font-size:22px;padding:4px 6px;line-height:1;flex-shrink:0}

/* inputs */
.inp{background:var(--card2);border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;color:var(--txt);width:100%;outline:none;display:block}
.inp::placeholder{color:var(--muted)}
textarea.inp{resize:vertical}

/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}

/* stats */
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:12px 14px}
.stat .sn{font-size:22px;font-weight:700;color:var(--gold);line-height:1}
.stat .sl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}

/* week nav */
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rng{flex:1;text-align:center;font-size:12px;color:var(--muted);font-weight:500}
.arw{background:var(--card2);border:1px solid var(--bdr);border-radius:10px;color:var(--gold);font-size:22px;width:40px;height:40px;line-height:40px;text-align:center;flex-shrink:0}

/* day grid */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dc{border-radius:10px;padding:8px 2px;cursor:pointer;text-align:center;background:var(--card);border:1px solid var(--bdr);user-select:none;transition:all .15s}
.dc.wknd{background:#f0f0fa;border-color:#d8d8ee}
.dc.tod{background:#fff8e8;border-color:#f0d080}
.dc.sel{background:var(--gold);border-color:var(--gold)}
.dc.hasstuff{border-color:#c47f00}
.dn{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.dc.wknd .dn{color:#8888bb}.dc.tod .dn{color:#b06a00}.dc.sel .dn{color:#fff}
.dd{font-size:17px;font-weight:700;color:var(--txt);margin:3px 0 2px}
.dc.sel .dd{color:#fff}
.db{font-size:9px;color:var(--dim)}
.dc.wknd .db{color:#c0c0dd}.dc.sel .db{color:#ffffff88}.dc.hasstuff .db{color:var(--gold)}

/* day label */
.dlabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dname{font-size:14px;font-weight:700}
.wlbl{margin-left:6px;font-size:10px;color:#6666aa;background:#ededf8;border:1px solid #d0d0ee;border-radius:10px;padding:2px 8px}
.tlbl{margin-left:6px;font-size:10px;color:#2e7d32;background:#e8f5e9;border:1px solid #c8e6c9;border-radius:10px;padding:2px 8px}

/* schedule items */
.srow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.srow:last-child{border-bottom:none}
.stime{font-size:11px;color:var(--muted);font-weight:600;width:60px;flex-shrink:0;padding-top:2px}
.sicon{font-size:16px;flex-shrink:0}
.sinfo{flex:1;min-width:0}
.stitle{font-size:13px;font-weight:600;color:var(--txt)}
.stitle.done{color:var(--dim);text-decoration:line-through}
.ssub{font-size:11px;color:var(--muted);margin-top:2px}

/* checklist */
.trow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)}
.trow:last-child{border-bottom:none}
.tick{width:22px;height:22px;border-radius:5px;flex-shrink:0;background:transparent;border:2px solid var(--bdr2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;cursor:pointer}
.tick.on{background:var(--gold);border-color:var(--gold)}

/* quick add panel */
.qabox{background:var(--card);border:1px solid #e8d8b0;border-radius:14px;padding:14px;margin-bottom:10px}
.qa-type-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qa-type-btn{padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--bdr2);background:var(--card2);color:var(--muted);cursor:pointer;transition:all .15s}
.qa-type-btn.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* tags */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-left:4px;white-space:nowrap}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}

/* progress */
.progwrap{height:4px;background:var(--bdr);border-radius:2px;margin-top:4px}
.progbar{height:4px;background:var(--gold);border-radius:2px}

/* pipeline */
.stlist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stbtn{background:var(--card2);border:1px solid var(--bdr);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--muted);min-height:36px}
.stbtn.on{background:#fff8e0;border-color:var(--gold);color:var(--gold)}
.stsbadge{border-radius:20px;padding:5px 11px;font-size:10px;font-weight:700;border:1px solid;white-space:nowrap;cursor:pointer}

/* today screen */
.today-item{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--bdr);margin-bottom:6px;cursor:pointer}
.today-icon{font-size:18px;flex-shrink:0}
.today-title{font-size:13px;font-weight:600}
.today-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* misc */
.empty{text-align:center;padding:24px 0;color:var(--dim);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.rowsb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;white-space:nowrap}
#toast.show{opacity:1}

/* alert panel */
#alert-panel{display:none;position:fixed;top:56px;right:10px;width:320px;max-width:95vw;background:var(--card);border:1px solid var(--bdr);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:9998;padding:14px;max-height:80vh;overflow-y:auto}
#alert-panel.show{display:block}

@media(max-width:600px){
  #hdr{padding:10px 13px}.logo{font-size:14px}
  #body{padding:10px 10px}.tab{font-size:10px;padding:10px 7px}
  .box{padding:12px 10px}.ptitle{font-size:15px}
  .g2{grid-template-columns:1fr}.g3{gap:6px}
  .stat{padding:10px 8px}.stat .sn{font-size:18px}
  #alert-panel{width:calc(100vw - 20px);right:10px}
}
</style>
</head>

function sow(d){var r=new Date(d);r.setDate(r.getDate()-r.getDay());r.setHours(0,0,0,0);return r;}
function addD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fk(d){return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}
function fl(d){return DN[d.getDay()]+" "+MN[d.getMonth()]+" "+d.getDate();}
function fr(ws){var we=addD(ws,6);return MN[ws.getMonth()]+" "+ws.getDate()+" - "+MN[we.getMonth()]+" "+we.getDate()+", "+we.getFullYear();}
function isToday(d){return fk(d)===fk(TODAY);}
function isWknd(d){return d.getDay()===0||d.getDay()===6;}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmt(n){return "$"+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtK(n){return n>=1000?"$"+(n/1000).toFixed(1)+"k":fmt(n);}
function todayStr(){return TODAY.toISOString().split("T")[0];}
function daysBetween(d1,d2){return Math.floor((new Date(d1)-new Date(d2))/(1000*60*60*24));}
function parseTime(s){
  if(!s)return"";
  s=s.trim().toLowerCase();
  var m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);
  if(!m)return s;
  var h=parseInt(m[1]),mn=m[2]||"00",ap=m[3];
  if(ap==="pm"&&h<12)h+=12;
  if(ap==="am"&&h===12)h=0;
  var suffix=h<12?"AM":"PM";
  var h12=h%12||12;
  return h12+":"+mn+" "+suffix;
}
function timeToMins(s){
  if(!s)return 9999;
  var m=s.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m)return 9999;
  var h=parseInt(m[1]),mn=parseInt(m[2]),ap=m[3].toUpperCase();
  if(ap==="PM"&&h<12)h+=12;
  if(ap==="AM"&&h===12)h=0;
  return h*60+mn;
}
function fmtTimeRange(from,to){
  if(!from)return"";
  return to?from+" – "+to:from;
}

function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2800);}

function go(id,btn){
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on");});
  document.getElementById(PANEL_IDS[id]).classList.add("on");
  btn.classList.add("on");ACTIVE=id;
  document.getElementById("alert-panel").classList.remove("show");
}
function goTab(id){
  var tabs=document.querySelectorAll(".tab");
  var names=Object.keys(PANEL_IDS);
  for(var i=0;i<names.length;i++){if(names[i]===id){tabs[i].click();break;}}

/* ===================== ALERTS ===================== */
var FOLLOWUP_DAYS={high:3,medium:7,low:14};
function getAlerts(){
  var alerts=[];var ts=todayStr();
  CLI.data.forEach(function(c){
    var days=FOLLOWUP_DAYS[c.priority]||7;
    var notes=CLI.notes[c.id]||[];
    var lastContact=c.lastContact||c.addedDate||null;
    if(notes.length){var s=notes.slice().sort(function(a,b){return new Date(b.date||0)-new Date(a.date||0);});if(s[0].date)lastContact=s[0].date;}
    if(lastContact){var diff=daysBetween(ts,lastContact);if(diff>=days)alerts.push({level:diff>=days*2?"red":"amber",icon:"👥",title:"Follow up: "+c.name,sub:"Last contact "+diff+" days ago ("+c.priority+" — every "+days+" days)",action:"goTab('clients')"});}
  });
  var todayItems=ITEMS.filter(function(x){return x.date===ts&&!x.done;});
  todayItems.forEach(function(x){
    if(x.type==="meeting")alerts.push({level:"blue",icon:"🤝",title:x.time+" · "+x.title,sub:x.meetingType||"Meeting",action:"goTab('planner')"});
    if(x.type==="training")alerts.push({level:"blue",icon:"🎓",title:x.time+" · "+x.title,sub:"Training",action:"goTab('planner')"});
  });
  for(var i=1;i<7;i++){
    var d=addD(TODAY,i);var ds=d.toISOString().split("T")[0];
    ITEMS.filter(function(x){return x.date===ds&&x.type==="meeting"&&!x.done;}).forEach(function(x){
      alerts.push({level:"green",icon:"📅",title:fl(d)+" · "+x.title,sub:x.meetingType||"Meeting",action:"goTab('planner')"});
    });
  }
  PIP.data.forEach(function(l){
    if(l.last&&l.last!=="Today"){try{var diff=daysBetween(ts,new Date(l.last+" 2026").toISOString().split("T")[0]);if(diff>7)alerts.push({level:"amber",icon:"📊",title:"Pipeline stale: "+l.name,sub:"Stage unchanged "+diff+" days",action:"goTab('pipeline')"});}catch(e){}}
  });
  return alerts;
}
function updateAlertBell(){
  var a=getAlerts();var cnt=document.getElementById("alert-count");
  if(a.length){cnt.textContent=a.length>9?"9+":a.length;cnt.style.display="flex";}else{cnt.style.display="none";}
}
function toggleAlertPanel(){
  var p=document.getElementById("alert-panel");p.classList.toggle("show");
  if(p.classList.contains("show")){
    var a=getAlerts();
    var colors={red:"#ffebee",amber:"#fffde7",blue:"#e3f2fd",green:"#e8f5e9"};
    var borders={red:"#ef9a9a",amber:"#ffe082",blue:"#90caf9",green:"#a5d6a7"};
    var html='<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:10px">🔔 Alerts & Reminders</div>';

function CONR(){
  var dp=CON.posts.filter(function(p){return p.day===CON.sel;});
  var ws=CON.ws;var days=Array.from({length:7},function(_,i){return addD(ws,i);});
  var grid='<div class="dgrid">';
  days.forEach(function(d){
    var k=fk(d);var cls="dc";if(k===CON.sel)cls+=" sel";else if(isToday(d))cls+=" tod";else if(isWknd(d))cls+=" wknd";
    var n=CON.posts.filter(function(p){return p.day===k;}).length;

function getCapYear(ds){var d=ds?new Date(ds):new Date();var y=d.getFullYear();var m=d.getMonth()+1;return m>=3?y:y-1;}
function calcDeal(sp,dc,capPaid){
  var gross=sp*0.03;var redOneAmt=gross*0.30;var remaining=CAP_LIMIT-capPaid;
  if(remaining<=0)redOneAmt=0;else if(redOneAmt>remaining)redOneAmt=remaining;
  var mentAmt=0;if(PROFIT.inMentoring){var mp=dc<6?0.20:0.10;mentAmt=gross*mp;}
  return{gross:gross,redOne:redOneAmt,mentoring:mentAmt,vera:gross-redOneAmt-mentAmt};
}

  try{var n=localStorage.getItem(NOTIF_KEY);return n?JSON.parse(n):{};} catch(e){return{};}
}

function sendNotif(title,body,tag){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{
    new Notification(title,{
      body:body,
      icon:'icon-192.png',
      tag:tag,
      badge:'icon-192.png'
    });
  }catch(e){}
}

function checkUpcomingNotifs(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var log=getNotifLog();
  var now=new Date();
  var todayS=todayStr();

  // get all items for today and next 7 days
  var upcoming=ITEMS.filter(function(x){
    return x.date>=todayS&&!x.done;
  });
  // also checklist items for today
  var clItems=(CHECKLIST[todayS]||[]).filter(function(x){return !x.done;});

  upcoming.forEach(function(x){
    if(!x.time)return;
    // parse item datetime
    var itemDate=new Date(x.date+"T00:00:00");
    var m=x.time.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if(!m)return;
    var h=parseInt(m[1]),mn=parseInt(m[2]),ap=m[3].toUpperCase();
    if(ap==="PM"&&h<12)h+=12;
    if(ap==="AM"&&h===12)h=0;
    itemDate.setHours(h,mn,0,0);

    var diffMins=Math.round((itemDate-now)/60000);
    var icon=x.type==="meeting"?"🤝":x.type==="training"?"🎓":"📌";

    // Morning of (7am on the day)
    var morningKey=x.id+"_morning_"+x.date;
    if(x.date===todayS&&!log[morningKey]){
      var morning=new Date(x.date+"T07:00:00");
      if(now>=morning&&now<new Date(x.date+"T07:10:00")){
        sendNotif("Good Morning! Today's Schedule",icon+" "+x.title+(x.time?" at "+x.time:""),morningKey);
        log[morningKey]=1;
      }
    }

    // 1 hour before
    var hrKey=x.id+"_1hr";
    if(!log[hrKey]&&diffMins>=55&&diffMins<=65){
      sendNotif("In 1 Hour — "+icon+" "+x.title,"Starting at "+x.time+(x.desc?" · "+x.desc:""),hrKey);
      log[hrKey]=1;
    }

    // 15 mins before
    var minKey=x.id+"_15min";
    if(!log[minKey]&&diffMins>=12&&diffMins<=17){
      sendNotif("Starting Soon — "+icon+" "+x.title,"In 15 minutes · "+x.time+(x.desc?" · "+x.desc:""),minKey);
      log[minKey]=1;
    }
  });

  // morning checklist summary
  var clMorningKey="checklist_morning_"+todayS;
  if(clItems.length&&!log[clMorningKey]){
    var morning=new Date(todayS+"T07:00:00");
    if(now>=morning&&now<new Date(todayS+"T07:10:00")){
      sendNotif("Today's Checklist — "+clItems.length+" items",clItems.slice(0,3).map(function(t){return"☐ "+t.task;}).join("\n"),clMorningKey);
      log[clMorningKey]=1;
    }
  }

  setNotifLog(log);
}

/* ===================== GOOGLE CALENDAR EXPORT ===================== */
function toGCalDate(dateStr,timeStr){
  // returns YYYYMMDDTHHMMSS format
  if(!timeStr)return dateStr.replace(/-/g,"");
  var m=timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m)return dateStr.replace(/-/g,"");
  var h=parseInt(m[1]),mn=parseInt(m[2]),ap=m[3].toUpperCase();
  if(ap==="PM"&&h<12)h+=12;
  if(ap==="AM"&&h===12)h=0;
  var ds=dateStr.replace(/-/g,"");
  return ds+"T"+String(h).padStart(2,"0")+String(mn).padStart(2,"0")+"00";
}

function addToGCal(id){
  var x=ITEMS.find(function(i){return i.id===id;});
  if(!x){toast("Item not found");return;}
  var title=encodeURIComponent(x.title);
  var start=toGCalDate(x.date,x.time);
  var end=x.timeTo?toGCalDate(x.date,x.timeTo):toGCalDate(x.date,x.time);
  // if no end time, add 1 hour
  if(!x.timeTo&&x.time){
    var m=x.time.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if(m){
      var h=parseInt(m[1]),mn=parseInt(m[2]),ap=m[3].toUpperCase();
      if(ap==="PM"&&h<12)h+=12;if(ap==="AM"&&h===12)h=0;
      h+=1;var ds=x.date.replace(/-/g,"");
      end=ds+"T"+String(h%24).padStart(2,"0")+String(mn).padStart(2,"0")+"00";
    }
  }
  var details=encodeURIComponent([x.desc||"",x.linkedTo||"",x.linkedTo2||""].filter(Boolean).join(" · "));
  var location=encodeURIComponent(x.desc||"");
  // build URL with 3 reminders via text (GCal handles reminder UI)
  var url="https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+title
    +"&dates="+start+"/"+end
    +"&details="+details
    +"&location="+location
    +"&sf=true&output=xml";
  window.open(url,"_blank");
  toast("Opening Google Calendar 📅");
}

function addCLtoGCal(k,id){
  var cl=(CHECKLIST[k]||[]).find(function(x){return x.id===id;});
  if(!cl)return;
  var title=encodeURIComponent("✅ "+cl.task);
  var ds=k.split("-");var d=new Date(+ds[0],+ds[1],+ds[2]);
  var dateS=d.getFullYear()+String(d.getMonth()).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  var url="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+title+"&dates="+dateS+"/"+dateS+"&sf=true&output=xml";
  window.open(url,"_blank");
  toast("Opening Google Calendar 📅");
}
