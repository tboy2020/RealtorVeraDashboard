<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vera Adegoke · Realtor Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f5f0;--card:#fff;--card2:#f0efea;--bdr:#e0ddd5;--bdr2:#d0cdc5;--txt:#1a1a1a;--muted:#888;--dim:#bbb;--gold:#c47f00;--green:#2e7d32;--blue:#1565c0;--purple:#6a1b9a;--red:#c62828}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px}
/* header */
#hdr{background:linear-gradient(135deg,#fffaf0,#fff8e8 50%,#fffaf0);border-bottom:1px solid #e8d8b0;padding:15px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:700;color:#b06a00}
.sub{font-size:11px;color:#a08060;margin-top:2px}
.right{font-size:10px;color:#c0a070;text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
/* tabs */
#tabs{display:flex;background:#fff;border-bottom:1px solid var(--bdr);overflow-x:auto;padding:0 16px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{font-size:12px;font-weight:600;padding:12px 11px;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--gold);border-bottom:2px solid var(--gold)}
/* body */
#body{padding:18px 16px;max-width:860px;margin:0 auto}
.panel{display:none}.panel.on{display:block}
/* boxes */
.box{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:10px}
.box.hi{border-color:#e8d8b0}.box.faded{opacity:.5}
.box.blue{border-color:#90caf9;background:#f0f7ff}
.box.green{border-color:#a5d6a7;background:#f0faf0}
.box.purple{border-color:#ce93d8;background:#faf0ff}
.box.amber{border-color:#ffe082;background:#fffde7}
/* typography */
.ptitle{font-size:19px;font-weight:700;color:var(--gold)}
.section{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
/* buttons */
.gbtn{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;min-height:44px}
.sbtn{background:var(--card2);color:var(--gold);border:1px solid var(--bdr2);border-radius:8px;padding:6px 13px;font-size:12px;font-weight:700;min-height:38px}
.sbtn.grn{background:#e8f5e9;border-color:#81c784;color:#2e7d32}
.sbtn.blu{background:#e3f2fd;border-color:#90caf9;color:#1565c0}
.sbtn.sml{padding:4px 10px;font-size:11px;min-height:30px}
.xbtn{background:none;border:none;color:var(--dim);font-size:22px;padding:4px 6px;line-height:1;flex-shrink:0}
/* inputs */
.inp{background:var(--card2);border:1px solid var(--bdr2);border-radius:8px;padding:10px 12px;color:var(--txt);width:100%;outline:none;display:block}
.inp::placeholder{color:var(--muted)}
textarea.inp{resize:vertical}
/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
/* stats */
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px 16px}
.stat .sn{font-size:26px;font-weight:700;color:var(--gold);line-height:1}
.stat .sl{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
/* week nav */
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rng{flex:1;text-align:center}
.r1{font-size:12px;color:var(--muted);font-weight:500}
.r2{font-size:10px;color:var(--dim);margin-top:3px}
.r2 kbd{background:var(--card2);border:1px solid var(--bdr2);border-radius:3px;padding:1px 5px;font-size:10px;color:var(--muted)}
.arw{background:var(--card2);border:1px solid var(--bdr);border-radius:10px;color:var(--gold);font-size:22px;width:40px;height:40px;line-height:40px;text-align:center;flex-shrink:0}
/* day grid */
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.dc{border-radius:10px;padding:8px 2px;cursor:pointer;text-align:center;background:var(--card);border:1px solid var(--bdr);user-select:none}
.dc.wknd{background:#f0f0fa;border-color:#d8d8ee}
.dc.tod{background:#fff8e8;border-color:#f0d080}
.dc.sel{background:var(--gold);border-color:var(--gold)}
.dn{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.dc.wknd .dn{color:#8888bb}.dc.tod .dn{color:#b06a00}.dc.sel .dn{color:#fff}
.dd{font-size:18px;font-weight:700;color:var(--txt);margin:3px 0 2px}
.dc.sel .dd{color:#fff}
.db{font-size:9px;color:var(--dim)}
.dc.wknd .db{color:#c0c0dd}.dc.sel .db{color:#ffffff88}
/* day label */
.dlabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dname{font-size:14px;font-weight:700}
.wlbl{margin-left:8px;font-size:10px;color:#6666aa;background:#ededf8;border:1px solid #d0d0ee;border-radius:10px;padding:2px 9px}
.tlbl{margin-left:8px;font-size:10px;color:#2e7d32;background:#e8f5e9;border:1px solid #c8e6c9;border-radius:10px;padding:2px 9px}
/* task rows */
.trow{display:flex;align-items:flex-start;gap:10px;padding:13px 0;border-bottom:1px solid var(--bdr)}
.trow:last-child{border-bottom:none}
.tick{width:24px;height:24px;border-radius:6px;flex-shrink:0;background:transparent;border:2px solid var(--bdr2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;cursor:pointer}
.tick.on{background:var(--gold);border-color:var(--gold)}
.tinfo{flex:1;min-width:0}
.ttl{font-size:13px;font-weight:600;color:var(--txt);word-break:break-word}
.ttl.done{color:var(--dim);text-decoration:line-through}
.tsub{font-size:11px;color:var(--muted);margin-top:3px}
/* tags / chips */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-left:4px;white-space:nowrap}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
/* progress */
.progwrap{height:4px;background:var(--bdr);border-radius:2px;margin-top:4px}
.progbar{height:4px;background:var(--gold);border-radius:2px}
/* stage buttons */
.stlist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stbtn{background:var(--card2);border:1px solid var(--bdr);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--muted);min-height:36px}
.stbtn.on{background:#fff8e0;border-color:var(--gold);color:var(--gold)}
.stsbadge{border-radius:20px;padding:5px 12px;font-size:10px;font-weight:700;border:1px solid;white-space:nowrap;cursor:pointer}
/* misc */
.empty{text-align:center;padding:32px 0;color:var(--dim);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.rowsb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rowt{display:flex;align-items:flex-start;gap:8px}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}
/* instruction page */
.step{display:flex;gap:14px;margin-bottom:20px;align-items:flex-start}
.stepnum{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.steptitle{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:4px}
.stepdesc{font-size:13px;color:var(--muted);line-height:1.6}
.flow{background:var(--card2);border:1px solid var(--bdr);border-radius:12px;padding:16px;margin:16px 0;font-size:13px;line-height:2;color:var(--txt)}
.arrow{color:var(--gold);font-weight:700;margin:0 6px}
.badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* mobile */
@media(max-width:600px){
  #hdr{padding:12px 14px}.logo{font-size:15px}.right{display:none}
  #body{padding:12px 10px}.tab{font-size:11px;padding:11px 8px}
  .box{padding:13px 11px}.ptitle{font-size:16px}
  .g2{grid-template-columns:1fr}.g3{gap:6px}
  .stat{padding:10px 8px}.stat .sn{font-size:20px}.stat .sl{font-size:9px}
  .dc .dd{font-size:15px}.r2{display:none}
}
</style>
</head>
<body>
<div id="hdr">
  <div><div class="logo">Vera Adegoke · Realtor 🏡</div><div class="sub">Licensed · Full-Time · Columbus, OH</div></div>
  <div class="right">Command Center</div>
</div>
<div id="tabs">
  <button class="tab on"  onclick="go('guide',this)">📖 Guide</button>
  <button class="tab" onclick="go('planner',this)">📅 Planner</button>
  <button class="tab" onclick="go('checklist',this)">✅ Checklist</button>
  <button class="tab" onclick="go('clients',this)">👥 Clients</button>
  <button class="tab" onclick="go('content',this)">📱 Content</button>
  <button class="tab" onclick="go('pipeline',this)">📊 Pipeline</button>
  <button class="tab" onclick="go('builds',this)">🏗️ Builds</button>
  <button class="tab" onclick="go('profit',this)">💰 Profit</button>
</div>
<div id="body">
  <div id="pguide"    class="panel on"></div>
  <div id="pplanner"  class="panel"></div>
  <div id="pchecklist"class="panel"></div>
  <div id="pclients"  class="panel"></div>
  <div id="pcontent"  class="panel"></div>
  <div id="ppipeline" class="panel"></div>
  <div id="pbuilds"   class="panel"></div>
  <div id="pprofit"   class="panel"></div>
</div>
<div id="toast"></div>

<script>
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var TODAY=new Date();
var ACTIVE="guide";

function sow(d){var r=new Date(d);r.setDate(r.getDate()-r.getDay());r.setHours(0,0,0,0);return r;}
function addD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fk(d){return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}
function fl(d){return DN[d.getDay()]+" "+MN[d.getMonth()]+" "+d.getDate();}
function fr(ws){var we=addD(ws,6);return MN[ws.getMonth()]+" "+ws.getDate()+" - "+MN[we.getMonth()]+" "+we.getDate()+", "+we.getFullYear();}
function isToday(d){return fk(d)===fk(TODAY);}
function isWknd(d){return d.getDay()===0||d.getDay()===6;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},2500);
}

var TAGS={
  client:{l:"Client",bg:"#fff0e0",c:"#b85000"},
  network:{l:"Network",bg:"#e6f4ea",c:"#1e6b35"},
  search:{l:"Search",bg:"#e8eeff",c:"#2645b8"},
  content:{l:"Content",bg:"#f5eeff",c:"#6b1db8"},
  training:{l:"Training",bg:"#fffbe6",c:"#8a6000"},
  meeting:{l:"Meeting",bg:"#ffe8ec",c:"#a81830"}
};
function tagBadge(t){var m=TAGS[t]||{l:t,bg:"#eee",c:"#666"};return '<span class="tag" style="background:'+m.bg+';color:'+m.c+'">'+m.l+'</span>';}
function chip(color,lbl){return '<span class="chip" style="background:'+color+'22;color:'+color+'">'+esc(lbl)+'</span>';}

var PANEL_IDS={guide:"pguide",planner:"pplanner",checklist:"pchecklist",clients:"pclients",content:"pcontent",pipeline:"ppipeline",builds:"pbuilds",profit:"pprofit"};
function go(id,btn){
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("on");});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on");});
  document.getElementById(PANEL_IDS[id]).classList.add("on");
  btn.classList.add("on");
  ACTIVE=id;
}

function navH(id,ws){
  return '<div class="wknav"><button class="arw" onclick="'+id+'P()">&#8249;</button><div class="rng"><div class="r1">'+fr(ws)+'</div><div class="r2"><kbd>&#8592;</kbd> / <kbd>&#8594;</kbd> navigate weeks</div></div><button class="arw" onclick="'+id+'N()">&#8250;</button></div>';
}
function gridH(id,ws,sel,bfn){
  var s='<div class="dgrid">';
  for(var i=0;i<7;i++){
    var d=addD(ws,i),k=fk(d),cls="dc";
    if(k===sel)cls+=" sel"; else if(isToday(d))cls+=" tod"; else if(isWknd(d))cls+=" wknd";
    var b=bfn?bfn(k):"";
    s+='<div class="'+cls+'" onclick="'+id+'S(\''+k+'\')"><div class="dn">'+DN[d.getDay()]+'</div><div class="dd">'+d.getDate()+'</div><div class="db">'+(b||".")+'</div></div>';
  }
  return s+"</div>";
}
function labelH(sd,right){
  right=right||"";
  var x=fl(sd)+(isWknd(sd)?'<span class="wlbl">Weekend</span>':"")+(isToday(sd)?'<span class="tlbl">Today</span>':"");
  return '<div class="dlabel"><div class="dname">'+x+'</div>'+right+'</div>';
}
function getSel(ws,sel){for(var i=0;i<7;i++){var d=addD(ws,i);if(fk(d)===sel)return d;}return TODAY;}
function progH(done,tot){
  var p=tot?Math.round(done/tot*100):0;
  return '<div style="text-align:right"><div style="font-size:12px;color:var(--gold);font-weight:700">'+done+'/'+tot+'</div><div class="progwrap" style="width:70px;margin-left:auto"><div class="progbar" style="width:'+p+'%"></div></div></div>';
}

/* ===================== GUIDE ===================== */
function GUIDER(){
  document.getElementById("pguide").innerHTML=
  '<div class="ptitle mb10">📖 How to Use Your Dashboard</div>'+
  '<div class="box amber mb10">'+
    '<div style="font-size:13px;font-weight:700;color:#b06a00;margin-bottom:6px">👋 Welcome, Vera!</div>'+
    '<div style="font-size:13px;color:var(--muted);line-height:1.7">This is your all-in-one real estate command center. Everything is connected — clients feed the pipeline, pipeline stages create planner tasks, and planner tasks flow into your daily checklist. Here is how to get started.</div>'+
  '</div>'+

  '<div class="section">🔁 How Everything Connects</div>'+
  '<div class="flow">'+
    '<span style="font-size:15px">👥</span> Add a <strong>Client</strong>'+
    '<span class="arrow">→</span> Auto-creates a <strong>Pipeline</strong> lead'+
    '<span class="arrow">→</span> Move pipeline stage'+
    '<span class="arrow">→</span> Auto-drops task in <strong>Planner</strong>'+
    '<span class="arrow">→</span> Push task to <strong>Checklist</strong>'+
    '<span class="arrow">→</span> Check it off ✅'+
  '</div>'+

  '<div class="section">✅ First Things To Do — In Order</div>'+

  '<div class="step">'+
    '<div class="stepnum">1</div>'+
    '<div><div class="steptitle">👥 Add Your Clients</div>'+
    '<div class="stepdesc">Go to the <strong>Clients</strong> tab first. Add each person you are working with — name, type (Buyer/Seller), status, and notes. When you tap <strong>"Add to Pipeline"</strong> on a client card, they automatically appear in your Pipeline as a lead. This is your starting point for everything.</div></div>'+
  '</div>'+

  '<div class="step">'+
    '<div class="stepnum">2</div>'+
    '<div><div class="steptitle">📊 Work Your Pipeline</div>'+
    '<div class="stepdesc">Go to <strong>Pipeline</strong>. Your clients are now leads. Move each one through the stages — Consultation → Agreement Sent → Searching → Land Search → Under Contract → Closed. Each time you move a stage, a suggested task is automatically added to your <strong>Planner</strong> for that week.</div></div>'+
  '</div>'+

  '<div class="step">'+
    '<div class="stepnum">3</div>'+
    '<div><div class="steptitle">📅 Review Your Planner</div>'+
    '<div class="stepdesc">Go to <strong>Planner</strong>. You will see auto-generated tasks from pipeline stage changes sitting alongside your existing tasks. Each task has an <strong>"Add to Checklist"</strong> button — tap it to push the task into today\'s checklist so you know exactly what to do right now.</div></div>'+
  '</div>'+

  '<div class="step">'+
    '<div class="stepnum">4</div>'+
    '<div><div class="steptitle">✅ Execute Your Checklist Daily</div>'+
    '<div class="stepdesc">Every morning open the <strong>Checklist</strong> tab. This is your focused to-do list for today. Items pushed from the Planner appear here. Add anything else you need to do. Work through it and check items off as you go. This is your daily execution layer.</div></div>'+
  '</div>'+

  '<div class="step">'+
    '<div class="stepnum">5</div>'+
    '<div><div class="steptitle">🏗️ Log Your New Build Visits</div>'+
    '<div class="stepdesc">Use the <strong>Builds</strong> tab to track new build communities. When viewing a community, clients in "Searching" stage will be suggested as a match — so you always know which buyers to bring to which community.</div></div>'+
  '</div>'+

  '<div class="step">'+
    '<div class="stepnum">6</div>'+
    '<div><div class="steptitle">📱 Plan Your Content</div>'+
    '<div class="stepdesc">The <strong>Content</strong> tab is your social media calendar. Plan posts by day, toggle them from Planned → Drafted → Posted. Use your Build visits and client milestones (e.g. a closing!) as content ideas. Consistency here feeds your pipeline with new leads.</div></div>'+
  '</div>'+

  '<div class="section">💡 Key Tips</div>'+
  '<div class="box">'+
    '<div class="stepdesc" style="line-height:2">'+
      '• <strong>Always start with Clients</strong> — everything flows from there<br/>'+
      '• <strong>Move pipeline stages</strong> as deals progress — tasks auto-generate<br/>'+
      '• <strong>Use Planner for the week</strong>, Checklist for today<br/>'+
      '• <strong>Data saves automatically</strong> — nothing is lost when you close the app<br/>'+
      '• <strong>Arrow keys ← →</strong> navigate weeks in Planner, Checklist and Content'+
    '</div>'+
  '</div>'+

  '<div style="text-align:center;margin-top:20px">'+
    '<button class="gbtn" onclick="goTab(\'clients\')">Get Started → Add Your First Client 👥</button>'+
  '</div>';
}
function goTab(id){
  var tabs=document.querySelectorAll(".tab");
  var names=["guide","planner","checklist","clients","content","pipeline","builds"];
  for(var i=0;i<names.length;i++){
    if(names[i]===id){tabs[i].click();break;}
  }
}

/* ===================== PLANNER ===================== */
var PL={ws:sow(TODAY),sel:fk(TODAY),open:false,f:{time:"",title:"",desc:"",tag:"client"},tasks:{}};
(function(){
  var ws=sow(TODAY);
  function dk(n){return fk(addD(ws,n));}
  PL.tasks[dk(0)]=[{id:"su1",time:"Flexible",title:"Week Review & Planning",desc:"Review wins & prep next week",tag:"client",done:false}];
  PL.tasks[dk(1)]=[
    {id:"m1",time:"10:00 AM",title:"Text Michael (Dr. Horton)",desc:"Schedule Wednesday consultation",tag:"client",done:false},
    {id:"m2",time:"10:15 AM",title:"Send Buyer Guide - Suzel",desc:"Email buyer agreement guide",tag:"client",done:false},
    {id:"m3",time:"10:30 AM",title:"Send Buyer Guide - Zahara",desc:"Send Si Zahara buyer guide",tag:"client",done:false},
    {id:"m4",time:"10:45 AM",title:"Speak with Pastor Lanre",desc:"Networking, referrals & community",tag:"network",done:false},
    {id:"m5",time:"11:15 AM",title:"Resume Property Search - Lucy",desc:"Continue MLS search for Lucy",tag:"search",done:false},
    {id:"m6",time:"11:45 AM",title:"Set Up Land Search - Zion",desc:"MLS land search criteria & alerts",tag:"search",done:false},
    {id:"m7",time:"12:00-5:00 PM",title:"Social Media & Content Block",desc:"All platforms, website, scheduling",tag:"content",done:false}
  ];
  PL.tasks[dk(2)]=[{id:"t1",time:"9:00 AM-1:00 PM",title:"Builder Training - Maronda Homes",desc:"Canal Winchester inventory & incentives",tag:"training",done:false}];
  PL.tasks[dk(3)]=[{id:"w1",time:"10:00 AM",title:"Consultation - Michael (Dr. Horton)",desc:"New construction & partnership",tag:"meeting",done:false}];
  PL.tasks[dk(4)]=[
    {id:"th1",time:"9:00 AM",title:"House Search for Suzel",desc:"MLS search, prepare shortlist",tag:"search",done:false},
    {id:"th2",time:"10:30 AM",title:"Visit Rockford Homes",desc:"New build photos, Reels & content",tag:"content",done:false},
    {id:"th3",time:"1:00 PM",title:"Fisher's Homes - Plain City",desc:"Two new build community visits",tag:"content",done:false}
  ];
  PL.tasks[dk(5)]=[{id:"f1",time:"9:00 AM-5:00 PM",title:"Full Content Creation Day",desc:"Edit visits, Reels, carousels, schedule",tag:"content",done:false}];
  PL.tasks[dk(6)]=[{id:"sa1",time:"10:00 AM",title:"Weekend Open Houses",desc:"Scout listings & attend open houses",tag:"search",done:false}];
})();

function PLR(){
  var days=[],i;for(i=0;i<7;i++)days.push(addD(PL.ws,i));
  var all=[];days.forEach(function(d){var t=PL.tasks[fk(d)];if(t)all=all.concat(t);});
  var dt=PL.tasks[PL.sel]||[];
  var sd=getSel(PL.ws,PL.sel);
  var rows=dt.length?dt.map(function(t){

}

  var matchBanner=searching.length?'<div class="box blue mb10"><div style="font-size:12px;font-weight:700;color:#1565c0;margin-bottom:4px">🔍 Clients currently searching — show them these communities:</div><div style="font-size:12px;color:#1565c0">'+searching.join(", ")+'</div></div>':"";
  var cards=BLD.data.map(function(b){

  }).join("");

function BLDC(){BLD.editing=null;BLD.ef={};BLDR();}
function BLDS(id){var b=BLD.data.find(function(x){return x.id===id;});if(b){if(BLD.ef.community!==undefined)b.community=BLD.ef.community;if(BLD.ef.location!==undefined)b.location=BLD.ef.location;if(BLD.ef.price!==undefined)b.price=BLD.ef.price;if(BLD.ef.status!==undefined)b.status=BLD.ef.status;if(BLD.ef.notes!==undefined)b.notes=BLD.ef.notes;}BLD.editing=null;BLD.ef={};BLDR();}

/* ===================== PROFIT ===================== */
var PROFIT={
  inMentoring:true,
  dealsCompleted:0,
  capYear:2026, // current RedOne cap year (resets March 1)
  capPaid:0,    // how much paid to RedOne this cap year
  deals:[],     // {id, client, salePrice, date, year, grossComm, redOne, mentoring, vera}
  open:false,
  nd:{client:"",salePrice:"",date:""}
};
var CAP_LIMIT=6000;
var COMM_RATE=0.03;

function getCapYear(dateStr){
  // cap year runs March 1 to Feb 28
  var d=dateStr?new Date(dateStr):new Date();
  var y=d.getFullYear();
  var m=d.getMonth()+1; // 1-based
  return m>=3?y:y-1;
}

function calcDeal(salePrice,dealsBeforeThis,capPaidBeforeThis){
  var gross=salePrice*COMM_RATE;
  // RedOne: 30% until $6000 cap per March year
  var redOnePct=0.30;
  var redOneAmt=gross*redOnePct;
  var remaining=CAP_LIMIT-capPaidBeforeThis;
  if(remaining<=0){redOneAmt=0;}
  else if(redOneAmt>remaining){redOneAmt=remaining;}
  // Mentoring
  var mentAmt=0;
  if(PROFIT.inMentoring){
    var mentPct=dealsBeforeThis<6?0.20:0.10;
    mentAmt=gross*mentPct;
  }
  var vera=gross-redOneAmt-mentAmt;
  return {gross:gross,redOne:redOneAmt,mentoring:mentAmt,vera:vera};
}

function fmt(n){return "$"+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtK(n){return n>=1000?"$"+(n/1000).toFixed(1)+"k":fmt(n);}

function PRR(){
  // group deals by cap year
  var yearMap={};
  var runningCapPaid=0;
  var runningDeals=0;
  // sort deals by date
  var sorted=PROFIT.deals.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  sorted.forEach(function(d){
    var cy=getCapYear(d.date);
    if(!yearMap[cy])yearMap[cy]={deals:[],grossTotal:0,redOneTotal:0,mentTotal:0,veraTotal:0};
    yearMap[cy].deals.push(d);
    yearMap[cy].grossTotal+=d.gross;
    yearMap[cy].redOneTotal+=d.redOne;
    yearMap[cy].mentTotal+=d.mentoring;
    yearMap[cy].veraTotal+=d.vera;
  });

  // settings box
  var mentStatus=PROFIT.inMentoring
    ?(PROFIT.dealsCompleted<6
      ?'<span style="color:#d4820a;font-weight:700">In Mentoring — Deal '+PROFIT.dealsCompleted+' of 6 (20% fee)</span>'
      :'<span style="color:#2e7d32;font-weight:700">In Mentoring — 6 deals done! (10% fee now)</span>')
    :'<span style="color:#888">Not in Mentoring Program</span>';

  // current cap year progress
  var curCapYear=getCapYear(null);
  var capThisYear=0;
  sorted.forEach(function(d){if(getCapYear(d.date)===curCapYear)capThisYear+=d.redOne;});
  var capPct=Math.min(100,Math.round(capThisYear/CAP_LIMIT*100));
  var capBar='<div style="margin-top:6px">'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px">'
    +'<span>RedOne Cap '+curCapYear+'-'+(curCapYear+1)+'</span>'
    +'<span>'+fmt(capThisYear)+' / '+fmt(CAP_LIMIT)+'</span></div>'
    +'<div style="height:8px;background:var(--bdr);border-radius:4px">'
    +'<div style="height:8px;background:'+(capPct>=100?'#27ae60':'#c47f00')+';border-radius:4px;width:'+capPct+'%"></div>'
    +'</div>'
    +(capPct>=100?'<div style="font-size:11px;color:#27ae60;font-weight:700;margin-top:4px">✅ Cap met! RedOne = $0 for rest of year</div>':'')
    +'</div>';

  var settings='<div class="box mb10">'
    +'<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:10px">⚙️ Commission Settings</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'
    +'<div style="background:var(--card2);border-radius:10px;padding:12px">'
    +'<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Commission Rate</div>'
    +'<div style="font-size:18px;font-weight:700;color:var(--txt)">3%</div>'
    +'<div style="font-size:10px;color:var(--muted)">of sale price</div>'
    +'</div>'
    +'<div style="background:var(--card2);border-radius:10px;padding:12px">'
    +'<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">RedOne Cut</div>'
    +'<div style="font-size:18px;font-weight:700;color:var(--txt)">30%</div>'
    +'<div style="font-size:10px;color:var(--muted)">until $6k cap (Mar-Feb)</div>'
    +'</div>'
    +'</div>'
    +capBar
    +'<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)">'
    +'<div style="font-size:12px;margin-bottom:8px">'+mentStatus+'</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">'
    +'<input type="checkbox" '+(PROFIT.inMentoring?"checked":"")+' onchange="PROFIT.inMentoring=this.checked;PRR()" style="width:18px;height:18px;cursor:pointer"/>'
    +'Currently in Mentoring Program</label>'
    +'</div>'
    +'<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'
    +'<span style="font-size:13px">Deals completed:</span>'
    +'<button class="sbtn sml" onclick="if(PROFIT.dealsCompleted>0)PROFIT.dealsCompleted--;PRR()">−</button>'
    +'<span style="font-size:16px;font-weight:700;color:var(--gold);min-width:24px;text-align:center">'+PROFIT.dealsCompleted+'</span>'
    +'<button class="sbtn sml" onclick="PROFIT.dealsCompleted++;PRR()">+</button>'
    +'<span style="font-size:11px;color:var(--muted)">'+(PROFIT.dealsCompleted<6?(6-PROFIT.dealsCompleted)+" more to 10% mentoring":"✅ 10% mentoring rate active")+'</span>'
    +'</div>'
    +'</div>'
    +'</div>';

  // add deal form
  var addForm=PROFIT.open?'<div class="box hi mb10">'
    +'<div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:10px">Add Closed Deal</div>'
    +'<div class="g2">'
    +'<input class="inp" placeholder="Client name" oninput="PROFIT.nd.client=this.value" value="'+esc(PROFIT.nd.client)+'"/>'
    +'<input class="inp" placeholder="Sale price e.g. 280000" oninput="PROFIT.nd.salePrice=this.value" value="'+esc(PROFIT.nd.salePrice)+'"/>'
    +'</div>'
    +'<input class="inp mb8" type="date" oninput="PROFIT.nd.date=this.value" value="'+esc(PROFIT.nd.date)+'"/>'
    +'<div class="row"><button class="gbtn" onclick="PRAdd()">Save Deal</button><button class="sbtn" onclick="PROFIT.open=false;PRR()">Cancel</button></div>'
    +'</div>':"";

  // year summaries
  var years=Object.keys(yearMap).sort(function(a,b){return b-a;});
  var yearCards=years.map(function(cy){
    var yd=yearMap[cy];
    var dealRows=yd.deals.map(function(d){
      return '<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:12px;align-items:center">'
        +'<div><div style="font-weight:600">'+esc(d.client)+'</div><div style="color:var(--muted);font-size:10px">'+esc(d.date)+(d.salePrice?' · '+fmtK(+d.salePrice):"")+'</div></div>'
        +'<div style="color:var(--muted)">'+fmtK(d.gross)+'</div>'
        +'<div style="color:#c0392b">-'+fmtK(d.redOne)+'</div>'
        +'<div style="color:#d4820a">-'+fmtK(d.mentoring)+'</div>'
        +'<div style="color:#27ae60;font-weight:700">'+fmtK(d.vera)+'</div>'
        +'</div>';
    }).join("");
    var label=cy+"-"+(+cy+1)+" (Mar–Feb)";
    return '<div class="box mb10">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
      +'<div style="font-size:15px;font-weight:700">📆 Year '+label+'</div>'
      +'<div style="text-align:right"><div style="font-size:10px;color:var(--muted)">Take-Home</div><div style="font-size:20px;font-weight:700;color:#27ae60">'+fmt(yd.veraTotal)+'</div></div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">'
      +'<div style="background:var(--card2);border-radius:8px;padding:10px;text-align:center">'
      +'<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Gross</div>'
      +'<div style="font-size:16px;font-weight:700;color:var(--txt)">'+fmtK(yd.grossTotal)+'</div></div>'
      +'<div style="background:#fff0f0;border-radius:8px;padding:10px;text-align:center">'
      +'<div style="font-size:10px;color:#c0392b;text-transform:uppercase;letter-spacing:.4px">RedOne</div>'
      +'<div style="font-size:16px;font-weight:700;color:#c0392b">-'+fmtK(yd.redOneTotal)+'</div></div>'
      +'<div style="background:#fff8e8;border-radius:8px;padding:10px;text-align:center">'
      +'<div style="font-size:10px;color:#d4820a;text-transform:uppercase;letter-spacing:.4px">Mentoring</div>'
      +'<div style="font-size:16px;font-weight:700;color:#d4820a">-'+fmtK(yd.mentTotal)+'</div></div>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:4px;padding:6px 0;border-bottom:2px solid var(--bdr)">'
      +'<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Deal</div>'
      +'<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase">Gross</div>'
      +'<div style="font-size:10px;font-weight:700;color:#c0392b;text-transform:uppercase">RedOne</div>'
      +'<div style="font-size:10px;font-weight:700;color:#d4820a;text-transform:uppercase">Ment.</div>'
      +'<div style="font-size:10px;font-weight:700;color:#27ae60;text-transform:uppercase">Vera</div>'
      +'</div>'
      +dealRows
      +'</div>';
  }).join("");

  var emptyMsg=years.length?"":'<div class="empty">No deals yet — add your first closed deal above!</div>';

  document.getElementById("pprofit").innerHTML=
    '<div class="rowsb mb10"><div class="ptitle">💰 Profit Tracker</div><button class="gbtn" onclick="PROFIT.open=!PROFIT.open;PRR()">+ Add Deal</button></div>'
    +settings+addForm+yearCards+emptyMsg;
  save();
}

function PRAdd(){
  var sp=parseFloat((PROFIT.nd.salePrice||"").replace(/[^0-9.]/g,""));
  if(!PROFIT.nd.client.trim()||isNaN(sp)||sp<=0){toast("Please enter client name and valid sale price");return;}
  var dateStr=PROFIT.nd.date||new Date().toISOString().split("T")[0];
  var cy=getCapYear(dateStr);
  // calc cap paid so far this cap year
  var capPaidSoFar=PROFIT.deals.filter(function(d){return getCapYear(d.date)===cy;}).reduce(function(s,d){return s+d.redOne;},0);
  var res=calcDeal(sp,PROFIT.dealsCompleted,capPaidSoFar);
  PROFIT.deals.push({
    id:"d"+Date.now(),
    client:PROFIT.nd.client,
    salePrice:sp,
    date:dateStr,
    gross:res.gross,
    redOne:res.redOne,
    mentoring:res.mentoring,
    vera:res.vera
  });
  PROFIT.dealsCompleted++;
  PROFIT.nd={client:"",salePrice:"",date:""};
  PROFIT.open=false;
  toast("Deal added! Vera earns "+fmt(res.vera)+" 🎉");
  PRR();
}
function save(){
  try{localStorage.setItem("vpl",JSON.stringify(PL.tasks));}catch(e){}
  try{localStorage.setItem("vcl",JSON.stringify(CL.items));}catch(e){}
  try{localStorage.setItem("vcli",JSON.stringify(CLI.data));}catch(e){}
  try{localStorage.setItem("vcon",JSON.stringify(CON.posts));}catch(e){}
  try{localStorage.setItem("vpip",JSON.stringify(PIP.data));}catch(e){}
  try{localStorage.setItem("vbld",JSON.stringify(BLD.data));}catch(e){}
}
function load(){
  try{var a=localStorage.getItem("vpl");if(a)PL.tasks=JSON.parse(a);}catch(e){}
  try{var b=localStorage.getItem("vcl");if(b)CL.items=JSON.parse(b);}catch(e){}
  try{var c=localStorage.getItem("vcli");if(c)CLI.data=JSON.parse(c);}catch(e){}
  try{var d=localStorage.getItem("vcon");if(d)CON.posts=JSON.parse(d);}catch(e){}
  try{var e=localStorage.getItem("vpip");if(e)PIP.data=JSON.parse(e);}catch(e2){}
  try{var f=localStorage.getItem("vbld");if(f)BLD.data=JSON.parse(f);}catch(e){}
}

/* ===================== ARROW KEYS ===================== */
document.addEventListener("keydown",function(ev){
  if(["INPUT","TEXTAREA","SELECT"].indexOf(ev.target.tagName)>-1)return;
  if(ev.key==="ArrowLeft"){ev.preventDefault();if(ACTIVE==="planner")PLP();else if(ACTIVE==="checklist")CLP();else if(ACTIVE==="content")CONP();}
  if(ev.key==="ArrowRight"){ev.preventDefault();if(ACTIVE==="planner")PLN();else if(ACTIVE==="checklist")CLN();else if(ACTIVE==="content")CONN();}
});

/* ===================== INIT ===================== */
load();
GUIDER();PLR();CLR();CLIR();CONR();PIPR();BLDR();PRR();
</script>
